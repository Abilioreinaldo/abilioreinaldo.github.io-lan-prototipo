<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WA Engenharia — Gestão Inteligente de Obras (protótipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f9;--card:#fff;--line:#e4e8f0;--line2:#eef1f6;--ink:#172036;--ink2:#3a465e;--mut:#5f6b82;--pri:#2f5bd8;--side:#16244a;--sideLine:#243462}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
#app{display:flex;height:100vh;overflow:hidden;position:relative}
aside{width:224px;flex-shrink:0;background:var(--side);display:flex;flex-direction:column;transition:width .2s}
aside.col{width:76px}
.brand{display:flex;align-items:center;gap:12px;padding:18px 16px 16px;border-bottom:1px solid var(--sideLine)}
.logo{width:40px;height:40px;flex-shrink:0;border-radius:10px;background:#3563e9;display:flex;align-items:center;justify-content:center}
.brand .lbl{min-width:0;overflow:hidden}
.brand b{display:block;font-size:15px;color:#fff;letter-spacing:.3px;white-space:nowrap}
.brand small{font-size:11px;color:#a9b5d3;white-space:nowrap}
nav{flex-grow:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.nv{display:flex;align-items:center;gap:12px;width:100%;min-height:40px;padding:0 12px;border:0;border-radius:8px;font-size:14px;text-align:left;background:transparent;color:#c3cde4;flex-shrink:0}
.nv:hover{background:#1f3160}
.nv.on{background:#3563e9;color:#fff;font-weight:600}
aside.col .nv{justify-content:center}
aside.col .lbl{display:none}
.user{border-top:1px solid var(--sideLine);padding:14px 16px;display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;flex-shrink:0;border-radius:50%;background:#6f7cf5;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.user b{display:block;font-size:14px;color:#fff}.user small{font-size:12px;color:#a9b5d3}
.col-main{flex-grow:1;min-width:0;display:flex;flex-direction:column}
header{height:60px;flex-shrink:0;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 20px}
.ib{width:44px;height:44px;border:0;background:transparent;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.ib:hover{background:#f1f3f8}
.search{flex-grow:1;display:flex;justify-content:center}
.search label{width:min(460px,100%);height:40px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#f1f3f8;border:1px solid #e0e5ee;border-radius:10px}
.search input{flex-grow:1;border:0;background:transparent;outline:none;font-size:14px;min-width:0}
.kbd{font-size:11px;color:var(--mut);background:#fff;border:1px solid #d9dfea;border-radius:5px;padding:2px 6px}
.plus{width:44px;height:44px;border:0;border-radius:10px;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center}
main{flex-grow:1;overflow-y:auto;padding:24px 28px 32px}
h1{margin:0;font-size:24px;font-weight:700}
.sub{margin:4px 0 0;font-size:14px;color:var(--ink2)}
h2{margin:0;font-size:16px;font-weight:600}
.stack{display:flex;flex-direction:column;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.pad{padding:18px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.gdash{display:grid;grid-template-columns:1fr 1.25fr .9fr;gap:16px}
.gfin{display:grid;grid-template-columns:1fr 1.2fr;gap:16px}
.hd{display:flex;align-items:center;justify-content:space-between}
.lnk{border:0;background:none;color:var(--pri);font-size:13px;font-weight:600;padding:8px 0}
.kpi{display:flex;gap:14px;align-items:flex-start;padding:20px;text-align:left;width:100%}
.kpi:hover,.row:hover{background:#fafbfd}
.kt{width:48px;height:48px;flex-shrink:0;border-radius:12px;display:flex;align-items:center;justify-content:center}
.kl{font-size:13px;color:var(--mut)}.kv{font-size:26px;font-weight:700;display:block}.kd{font-size:12px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border:0;border-top:1px solid var(--line2);background:none;text-align:left;width:100%}
.tile{width:38px;height:38px;flex-shrink:0;border-radius:9px;display:flex;align-items:center;justify-content:center}
.nm{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.lc{font-size:12px;color:var(--mut)}
.bd{display:inline-block;white-space:nowrap;font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px}
.grow{flex-grow:1;min-width:0}
.bar{height:8px;background:#eaeef5;border-radius:5px;overflow:hidden;flex-grow:1}
.bar>span{display:block;height:100%;border-radius:5px}
.tbl-h{display:grid;gap:12px;padding:12px 20px;background:#f7f9fc;border-bottom:1px solid var(--line);font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.tbl-r{display:grid;gap:12px;align-items:center;width:100%;padding:14px 20px;border:0;border-bottom:1px solid var(--line2);background:#fff;text-align:left;font-size:14px}
.cols-obras{grid-template-columns:2.4fr 1.3fr 1.2fr .9fr 1fr 1.4fr}
.cols-ped{grid-template-columns:.8fr 2fr 1.5fr 1.5fr 1fr 1.4fr}
.chip{height:36px;padding:0 14px;border-radius:18px;font-size:13px;font-weight:600;background:#fff;color:var(--ink2);border:1px solid #d9dfea}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn{height:44px;padding:0 18px;border:0;border-radius:10px;background:var(--pri);color:#fff;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn.ghost{background:#fff;border:1px solid #d9dfea;color:var(--ink2)}
.btn.sm{height:32px;padding:0 12px;font-size:12px;border-radius:8px}
.btn.out{height:36px;width:84px;justify-content:center;background:#fff;border:1px solid var(--pri);color:var(--pri);font-size:13px;border-radius:8px}
.tabs{display:flex;gap:4px;padding:0 16px;border-bottom:1px solid var(--line)}
.tab{height:48px;padding:0 14px;border:0;background:none;font-size:14px;font-weight:600;margin-bottom:-1px;color:var(--mut);border-bottom:2px solid transparent}
.tab.on{color:var(--pri);border-bottom-color:var(--pri)}
.gantt-row{display:grid;grid-template-columns:240px 1fr;gap:16px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line2)}
.track{position:relative;height:30px;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(100%/12 - 1px),#eef1f6 calc(100%/12 - 1px),#eef1f6 calc(100%/12))}
.gb{position:absolute;top:3px;height:24px;border-radius:6px;overflow:hidden;display:flex;align-items:center}
.gb i{position:absolute;left:0;top:0;bottom:0}
.gb em{position:relative;font-style:normal;font-size:11px;font-weight:700;color:#fff;padding:0 8px}
.today{position:absolute;left:72%;top:-10px;bottom:-10px;width:2px;background:#d6453d}
.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));font-size:12px;font-weight:600;color:var(--mut);text-align:center}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.dlg{width:480px;max-width:100%;background:#fff;border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 50px rgba(15,23,42,.25)}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink2)}
.fld input,.fld select{height:42px;border:1px solid #d9dfea;border-radius:8px;padding:0 12px;font-size:14px;font-weight:400;background:#fff}
.toast{position:fixed;right:24px;bottom:24px;background:var(--ink);color:#fff;border-radius:10px;padding:12px 16px;font-size:14px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(15,23,42,.3);z-index:20}
.muted{color:var(--mut)}
@media (max-width:1100px){.gdash{grid-template-columns:1fr 1fr}.gdash>:last-child{grid-column:1/-1}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
  aside{position:absolute;z-index:5;height:100%;transform:translateX(0);transition:transform .2s}
  aside.col{transform:translateX(-100%);width:224px}
  aside.col .lbl{display:inline}
  main{padding:16px}
  .gdash,.g3,.gfin,.g4{grid-template-columns:1fr}
  .kbd{display:none}
  .scroll-x{overflow-x:auto}
  .scroll-x>*{min-width:760px}
  .gantt-row{grid-template-columns:140px 1fr}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
const svg=(d,s=18,w=1.9,c='currentColor')=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const I={
 dashboard:'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z',obras:'M3 21h18M5 21V8l7-5 7 5v13M9 21v-6h6v6',
 planejamento:'M3 5h18v16H3zM3 10h18M8 3v4M16 3v4',projetos:'M3 6h6l2 2h10v12H3z',orcamento:'M5 3h14v18H5zM8 7h8M8 12h2M14 12h2M8 16h2M14 16h2',
 financeiro:'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18M15 9h-4a2 2 0 0 0 0 4h2a2 2 0 0 1 0 4H9M12 6v2M12 16v2',compras:'M3 4h2l2 11h11l2-8H6M9 20h.01M17 20h.01',
 estoque:'M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10',equipamentos:'M14 7a4 4 0 0 0 5 5l-9 9-3-3 9-9a4 4 0 0 0-2-2z',
 rh:'M12 12a4 4 0 1 0 0-8a4 4 0 1 0 0 8M4 21c0-4 4-6 8-6s8 2 8 6',seguranca:'M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z',
 documentos:'M6 3h9l4 4v14H6zM14 3v5h5M9 13h6M9 17h6',contratos:'M6 3h9l4 4v14H6zM9 15l2 2 4-4',
 clientes:'M9 11a4 4 0 1 0 0-8a4 4 0 1 0 0 8M2 21c0-4 3-6 7-6s7 2 7 6M16 3a4 4 0 0 1 0 8M22 21c0-3-2-5-4-6',
 fornecedores:'M2 6h12v10H2zM14 10h4l3 3v3h-7M6 19a2 2 0 1 0 0-4a2 2 0 1 0 0 4M17 19a2 2 0 1 0 0-4a2 2 0 1 0 0 4',
 marketplace:'M4 9l1-5h14l1 5M4 9h16v11H4zM9 20v-6h6v6',relatorios:'M5 20V10M10 20V4M15 20v-8M20 20v-5',ia:'M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z'};
const NAV=[['dashboard','Dashboard'],['obras','Obras'],['planejamento','Planejamento'],['projetos','Projetos'],['orcamento','Orçamento'],['financeiro','Financeiro'],['compras','Compras'],['estoque','Estoque'],['equipamentos','Equipamentos'],['rh','RH'],['seguranca','Segurança do Trabalho'],['documentos','Documentos'],['contratos','Contratos'],['clientes','Clientes'],['fornecedores','Fornecedores'],['marketplace','Marketplace'],['relatorios','Relatórios'],['ia','IA & Automações']];
const BUILD='M4 21V9l8-5 8 5v12M9 21v-5h6v5';
const BADGE={'Em execução':['#e3f5e9','#1a6b3c'],'Planejamento':['#e6ecfd','#2447b3'],'Aguardando material':['#fdf1d8','#8a5800'],'Paralisada':['#fde4e2','#a3221b'],'Aguardando aprovação':['#fdf1d8','#8a5800'],'Aprovado':['#e6ecfd','#2447b3'],'Em trânsito':['#efe9fd','#5a3bb3'],'Entregue':['#e3f5e9','#1a6b3c']};
const bd=s=>{const c=BADGE[s]||['#eceff4','#3a465e'];return `<span class="bd" style="background:${c[0]};color:${c[1]}">${esc(s)}</span>`};

const S={screen:'dashboard',obraId:'vista',tab:'resumo',collapsed:window.innerWidth<820,modal:false,filter:'Todas',q:'',toast:'',doneTasks:{},pagas:{},aprovados:{},
 obras:[
 {id:'vista',nome:'Residencial Vista do Sol',local:'Praia Brava, Itajaí - SC',status:'Em execução',prog:72,cor:'#3f6fe0',resp:'Juliana Silva',inicio:'Fev/26',prazo:'Dez/26',orc:'R$ 2,40M',real:'R$ 1,62M',equipe:48,gs:2,ge:12},
 {id:'plaza',nome:'Edifício Plaza Corporate',local:'Centro, São Paulo - SP',status:'Em execução',prog:45,cor:'#6a5ae0',resp:'Ricardo Alves',inicio:'Mar/26',prazo:'Mar/27',orc:'R$ 3,10M',real:'R$ 1,31M',equipe:62,gs:3,ge:12},
 {id:'shopping',nome:'Shopping Park Sul',local:'Porto Alegre - RS',status:'Planejamento',prog:15,cor:'#2f9e6a',resp:'Fernanda Costa',inicio:'Ago/26',prazo:'Jun/28',orc:'R$ 1,20M',real:'R$ 0,14M',equipe:12,gs:8,ge:12},
 {id:'galpao',nome:'Galpão Logístico XPTO',local:'Cajamar - SP',status:'Aguardando material',prog:30,cor:'#d9892a',resp:'Marcos Pereira',inicio:'Mai/26',prazo:'Nov/26',orc:'R$ 0,95M',real:'R$ 0,31M',equipe:21,gs:5,ge:11},
 {id:'escola',nome:'Escola Municipal Horizonte',local:'Belo Horizonte - MG',status:'Em execução',prog:60,cor:'#d24b4b',resp:'Ana Ribeiro',inicio:'Jan/26',prazo:'Out/26',orc:'R$ 0,77M',real:'R$ 0,46M',equipe:27,gs:1,ge:10},
 {id:'clinica',nome:'Clínica Santa Luzia',local:'Campinas - SP',status:'Em execução',prog:82,cor:'#1f93a3',resp:'Paulo Nunes',inicio:'Jan/26',prazo:'Out/26',orc:'R$ 0,58M',real:'R$ 0,49M',equipe:18,gs:1,ge:10},
 {id:'recanto',nome:'Condomínio Recanto Verde',local:'Joinville - SC',status:'Paralisada',prog:38,cor:'#7a8499',resp:'Juliana Silva',inicio:'Abr/26',prazo:'Jan/27',orc:'R$ 1,85M',real:'R$ 0,71M',equipe:0,gs:4,ge:12}]};

const TASKS=[['t1','Finalizar concretagem da laje','Alta','25/09'],['t2','Aprovar medição de setembro','Alta','26/09'],['t3','Revisar projeto elétrico','Média','29/09'],['t4','Enviar relatório ao cliente','Baixa','30/09']];
const PRIO={'Alta':['#fde4e2','#a3221b'],'Média':['#fdf1d8','#8a5800'],'Baixa':['#eceff4','#3a465e']};
const PED=[['PC-1048','Cimento CP-II','500 sacos','Cimentos Sul Ltda','Vista do Sol','R$ 21.500','Aguardando aprovação'],['PC-1047','Aço CA-50 10mm','8 t','Metalúrgica Paraná','Plaza Corporate','R$ 58.400','Aguardando aprovação'],['PC-1046','Bloco cerâmico 14x19','12.000 un','Cerâmica Horizonte','Escola Horizonte','R$ 16.800','Aguardando aprovação'],['PC-1045','Telha termoacústica','1.200 m²','CobreBem Telhas','Galpão XPTO','R$ 94.200','Em trânsito'],['PC-1044','Cabo flexível 6mm','3.000 m','EletroForte','Clínica Santa Luzia','R$ 12.900','Aprovado'],['PC-1043','Areia média lavada','80 m³','Areal Rio Claro','Vista do Sol','R$ 9.600','Entregue']];
const CONTAS=[['c1','Concreto usinado — 42 m³','Vista do Sol','25/09','R$ 18.900'],['c2','Locação de grua','Plaza Corporate','26/09','R$ 32.000'],['c3','Empreiteira de alvenaria','Escola Horizonte','27/09','R$ 45.300'],['c4','Andaimes — medição set.','Clínica Santa Luzia','30/09','R$ 7.450'],['c5','Projeto de climatização','Shopping Park Sul','02/10','R$ 22.000']];

const pedStatus=p=>S.aprovados[p[0]]?'Aprovado':p[6];
const pendentes=()=>PED.filter(p=>pedStatus(p)==='Aguardando aprovação').length;
const abertas=()=>CONTAS.filter(c=>!S.pagas[c[0]]).length;
const set=o=>{Object.assign(S,o);render()};
let tt;const flash=m=>{set({toast:m});clearTimeout(tt);tt=setTimeout(()=>set({toast:''}),2600)};

function side(){
 const a=S.screen==='obra'?'obras':S.screen;
 return `<aside class="${S.collapsed?'col':''}">
 <div class="brand"><div class="logo">${svg(I.obras,22,2,'#fff')}</div><div class="lbl"><b>WA ENGENHARIA</b><small>Gestão Inteligente de Obras</small></div></div>
 <nav aria-label="Menu principal">${NAV.map(([id,l])=>`<button class="nv ${a===id?'on':''}" data-go="${id}" title="${l}" aria-label="${l}">${svg(I[id])}<span class="lbl">${l}</span></button>`).join('')}</nav>
 <div class="user"><div class="av">CM</div><div class="lbl"><b>Carlos Mendes</b><small>Administrador</small></div></div></aside>`;
}
function head(){
 return `<header><button class="ib" data-act="toggle" aria-label="Recolher ou expandir menu">${svg('M4 6h16M4 12h16M4 18h16',22,2)}</button>
 <div class="search"><label>${svg('M11 18a7 7 0 1 0 0-14a7 7 0 1 0 0 14M21 21l-5-5',16,2,'#5f6b82')}<input id="q" type="search" value="${esc(S.q)}" placeholder="Buscar obras, projetos, documentos..." aria-label="Buscar"><span class="kbd">Ctrl + K</span></label></div>
 <button class="plus" data-act="modal" aria-label="Nova obra">${svg('M12 5v14M5 12h14',20,2.2)}</button></header>`;
}
const tile=(o,s=38,r=9,i=18)=>`<span class="tile" style="background:${o.cor};width:${s}px;height:${s}px;border-radius:${r}px">${svg(BUILD,i,2,'#fff')}</span>`;

function dash(){
 const done=Object.values(S.doneTasks).filter(Boolean).length;
 const kt=(bg,fg,d)=>`<span class="kt" style="background:${bg};color:${fg}">${svg(d,22)}</span>`;
 const k=[['obras',kt('#e6ecfd','#2447b3',I.obras),'Obras em andamento',S.obras.filter(o=>o.status!=='Paralisada').length,'↑ 2 desde o mês passado','#1a6b3c'],
  ['planejamento',kt('#e3f5e9','#1a6b3c','M4 4h16v16H4zM8 12l3 3 5-6'),'Tarefas pendentes',48-done,'↑ 8% desde a semana passada','#1a6b3c'],
  ['financeiro',kt('#fdf1d8','#8a5800','M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18M12 7v5l3 3'),'Custo total das obras','R$ 8,42M','↓ 4% abaixo do orçamento','#2447b3'],
  ['financeiro',kt('#fde4e2','#a3221b','M3 6h18v12H3zM3 10h18M7 15h4'),'Receitas no mês','R$ 1,25M','↑ 12% desde o mês passado','#1a6b3c']];
 const ag=[['08:00','Reunião de alinhamento','Residencial Vista do Sol','#2f5bd8'],['10:30','Visita técnica','Edifício Plaza Corporate','#2e9b5a'],['14:00','Reunião com fornecedor','Metalúrgica Paraná','#6a5ae0'],['16:00','Análise de orçamento','Shopping Park Sul','#d9892a']];
 const at=[['JS','Juliana Silva','adicionou 12 fotos no diário de obra','Há 25 min · Vista do Sol'],['RA','Ricardo Alves','atualizou o cronograma','Há 1 h · Plaza Corporate'],['MP','Marcos Pereira','registrou recebimento de material','Há 2 h · Galpão XPTO'],['AR','Ana Ribeiro','concluiu a vistoria de segurança','Ontem · Escola Horizonte']];
 const al=[['Documentos vencendo','ARTs e licenças nos próximos 15 dias',5,['#fde4e2','#a3221b','#c93a31'],'documentos'],['Pedidos aguardando aprovação','Compras acima de R$ 20 mil',pendentes(),['#fdf1d8','#8a5800','#c77a0a'],'compras'],['Contas vencendo esta semana','Fornecedores e terceiros',abertas(),['#e6ecfd','#2447b3','#2f5bd8'],'financeiro'],['Obra paralisada','Condomínio Recanto Verde',1,['#eceff4','#3a465e','#5f6b82'],'obras']];
 const tl=TASKS.filter(t=>!S.doneTasks[t[0]]).length;
 return `<div class="stack"><div><h1 style="font-size:26px">Bom dia, Carlos!</h1><p class="sub">Aqui está o resumo do que está acontecendo hoje.</p></div>
 <div class="g4">${k.map(x=>`<button class="card kpi" data-go="${x[0]}">${x[1]}<span><span class="kl">${x[2]}</span><span class="kv">${x[3]}</span><span class="kd" style="color:${x[5]}">${x[4]}</span></span></button>`).join('')}</div>
 <div class="gdash">

function go(s){S.modal=false;S.screen=s;if(window.innerWidth<820)S.collapsed=true;render();app.querySelector('main').scrollTop=0;history.replaceState(null,'','#'+s)}

app.addEventListener('click',e=>{
 const t=e.target.closest('[data-go],[data-obra],[data-act],[data-filter],[data-tab],[data-pagar],[data-aprovar]');if(!t)return;
 const d=t.dataset;
 if(d.go)return go(d.go);
 if(d.obra){S.obraId=d.obra;S.tab='resumo';return go('obra')}
 if(d.filter)return set({filter:d.filter});
 if(d.tab)return set({tab:d.tab});
 if(d.pagar){const c=CONTAS.find(x=>x[0]===d.pagar);S.pagas[d.pagar]=true;S._keepScroll=true;return flash('Pagamento agendado: '+c[1])}
 if(d.aprovar){S.aprovados[d.aprovar]=true;S._keepScroll=true;return flash('Pedido '+d.aprovar+' aprovado')}
 if(d.act==='toggle')return set({collapsed:!S.collapsed});
 if(d.act==='modal'){set({modal:true});setTimeout(()=>{const n=document.getElementById('fNome');n&&n.focus()},0);return}
 if(d.act==='close'||(d.act==='close-bg'&&e.target===t))return set({modal:false});
 if(d.act==='criar'){
  const nome=document.getElementById('fNome').value.trim()||'Nova obra sem nome';
  const local=document.getElementById('fLocal').value.trim()||'Local a definir';
  const status=document.getElementById('fStatus').value;
  S.obras.unshift({id:'n'+Date.now(),nome,local,status,prog:0,cor:'#2f5bd8',resp:'Carlos Mendes',inicio:'Out/26',prazo:'A definir',orc:'A definir',real:'R$ 0,00',equipe:0,gs:10,ge:12});
  S.filter='Todas';S.q='';S.modal=false;go('obras');flash('Obra “'+nome+'” criada');
 }
});
app.addEventListener('change',e=>{if(e.target.dataset.task){S.doneTasks[e.target.dataset.task]=e.target.checked;S._keepScroll=true;render()}});
app.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;S.filter='Todas';if(S.screen!=='obras'){S.screen='obras'}render()}});
document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('q').focus()}
 if(e.key==='Escape'&&S.modal)set({modal:false});
});
const h=location.hash.slice(1);if(h&&NAV.some(n=>n[0]===h))S.screen=h;
render();
})();
</script>
</body>
</html>
