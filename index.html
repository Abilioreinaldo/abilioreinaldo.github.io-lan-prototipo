html,body{margin:0;height:100%}

button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer}

#app{display:flex;height:100vh;overflow:hidden;position:relative}
aside{width:224px;flex-shrink:0;background:var(--side);display:flex;flex-direction:column;transition:width .2s}
aside.col{width:76px}

.nv:hover{background:#2a2f36}
.nv.on{background:#454b54;color:#fff;font-weight:600}
aside.col .nv{justify-content:center}

.user{border-top:1px solid var(--sideLine);padding:14px 16px;display:flex;align-items:center;gap:10px}

.col-main{flex-grow:1;min-width:0;display:flex;flex-direction:column}
header{height:60px;flex-shrink:0;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 20px}

.kbd{font-size:11px;color:var(--mut);background:#fff;border:1px solid #dcdfe3;border-radius:5px;padding:2px 6px}

main{flex-grow:1;overflow-y:auto;padding:24px 28px 32px}
h1{margin:0;font-size:24px;font-weight:700}
.sub{margin:4px 0 0;font-size:14px;color:var(--ink2)}

.stack{display:flex;flex-direction:column;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.pad{padding:18px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.gdash{display:grid;grid-template-columns:1fr 1.25fr .9fr;gap:16px}
.gfin{display:grid;grid-template-columns:1fr 1.2fr;gap:16px}
.hd{display:flex;align-items:center;justify-content:space-between}
.lnk{border:0;background:none;color:var(--pri);font-size:13px;font-weight:600;padding:8px 0}
.kpi{display:flex;gap:14px;align-items:flex-start;padding:20px;text-align:left;width:100%}
.kpi:hover,.row:hover{background:#fafafb}
.kt{width:48px;height:48px;flex-shrink:0;border-radius:12px;display:flex;align-items:center;justify-content:center}
.kl{font-size:13px;color:var(--mut)}.kv{font-size:26px;font-weight:700;display:block}.kd{font-size:12px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border:0;border-top:1px solid var(--line2);background:none;text-align:left;width:100%}
.tile{width:38px;height:38px;flex-shrink:0;border-radius:9px;display:flex;align-items:center;justify-content:center}
.nm{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.lc{font-size:12px;color:var(--mut)}

.gantt-row{display:grid;grid-template-columns:240px 1fr;gap:16px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line2)}
.track{position:relative;height:30px;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(100%/12 - 1px),#eeeff1 calc(100%/12 - 1px),#eeeff1 calc(100%/12))}
.gb{position:absolute;top:3px;height:24px;border-radius:6px;overflow:hidden;display:flex;align-items:center}
.gb i{position:absolute;left:0;top:0;bottom:0}
.gb em{position:relative;font-style:normal;font-size:11px;font-weight:700;color:#fff;padding:0 8px}
.today{position:absolute;left:72%;top:-10px;bottom:-10px;width:2px;background:#d6453d}
.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));font-size:12px;font-weight:600;color:var(--mut);text-align:center}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.dlg{width:480px;max-width:100%;background:#fff;border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 50px rgba(15,23,42,.25)}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink2)}
.fld input,.fld select{height:42px;border:1px solid #dcdfe3;border-radius:8px;padding:0 12px;font-size:14px;font-weight:400;background:#fff}
.toast{position:fixed;right:24px;bottom:24px;background:var(--ink);color:#fff;border-radius:10px;padding:12px 16px;font-size:14px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(15,23,42,.3);z-index:20}
.muted{color:var(--mut)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.sw{width:42px;height:24px;border-radius:12px;border:0;background:#cdd1d6;position:relative;flex-shrink:0;padding:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:#2e9b5a}.sw.on::after{left:21px}
.eq{display:flex;flex-direction:column;gap:12px;padding:18px}
.star{color:#e0a21b;letter-spacing:1px}
.scroll-tabs{overflow-x:auto;scrollbar-width:none}.scroll-tabs .tab{white-space:nowrap;flex-shrink:0}

@media (max-width:1100px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.gdash{grid-template-columns:1fr 1fr}.gdash>:last-child{grid-column:1/-1}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){

  aside.col .lbl{display:inline}
  main{padding:16px}
  .gdash,.g3,.gfin,.g4,.g2{grid-template-columns:1fr}
  .kbd{display:none}
  .scroll-x{overflow-x:auto}
  .scroll-x>*{min-width:760px}
  .gantt-row{grid-template-columns:140px 1fr}
}

  <g fill="#2e9b5a"><circle cx="50" cy="125.4" r="3.5"/><circle cx="132" cy="105.9" r="3.5"/><circle cx="214" cy="84.8" r="3.5"/><circle cx="296" cy="65.3" r="3.5"/><circle cx="378" cy="53.9" r="3.5"/></g></svg>

function obras(){
 const q=S.q.toLowerCase();
 const list=S.obras.filter(o=>(S.filter==='Todas'||o.status===S.filter)&&(!q||(o.nome+' '+o.local+' '+o.resp).toLowerCase().includes(q)));
 return `<div class="stack"><div class="hd" style="align-items:flex-end"><div><h1>Obras</h1><p class="sub">${S.obras.length} obras cadastradas</p></div><button class="btn" data-act="modal">${svg('M12 5v14M5 12h14',16,2.2)}Nova obra</button></div>
 <div style="display:flex;gap:8px;flex-wrap:wrap">${['Todas','Em execução','Planejamento','Aguardando material','Paralisada'].map(f=>`<button class="chip ${S.filter===f?'on':''}" data-filter="${f}">${f}</button>`).join('')}</div>
 <div class="card scroll-x" style="overflow:hidden"><div><div class="tbl-h cols-obras"><span>Obra</span><span>Status</span><span>Responsável</span><span>Prazo</span><span>Orçamento</span><span>Progresso</span></div>
 ${list.map(o=>`<button class="tbl-r cols-obras row" style="border-top:0" data-obra="${o.id}"><span style="display:flex;align-items:center;gap:12px;min-width:0">${tile(o)}<span style="min-width:0"><span class="nm">${esc(o.nome)}</span><span class="lc">${esc(o.local)}</span></span></span><span>${bd(o.status)}</span><span>${esc(o.resp)}</span><span>${esc(o.prazo)}</span><b>${esc(o.orc)}</b><span style="display:flex;align-items:center;gap:10px"><span class="bar"><span style="width:${o.prog}%;background:${o.cor}"></span></span><b style="width:36px;font-size:13px">${o.prog}%</b></span></button>`).join('')}
 ${list.length?'':`<div style="padding:40px;text-align:center" class="muted">Nenhuma obra encontrada${S.q?` para “${esc(S.q)}”`:''}.</div>`}</div></div></div>`;
}

function obra(){
 const o=S.obras.find(x=>x.id===S.obraId)||S.obras[0];
 const fac=[1.6,1.3,1,.7,.3];
 const et=['Fundação','Estrutura','Alvenaria','Instalações','Acabamento'].map((n,i)=>[n,Math.min(100,Math.round(o.prog*fac[i]))]);
 const kc=(l,v,c='')=>`<div class="card" style="padding:16px 18px"><div class="kl">${l}</div><b style="font-size:22px;${c}">${v}</b></div>`;
 let body='';
 if(S.tab==='resumo')body=`<div class="stack" style="gap:14px">${et.map(e=>`<div style="display:grid;grid-template-columns:160px 1fr 50px;gap:16px;align-items:center;font-size:14px"><span style="font-weight:500">${e[0]}</span><span class="bar" style="height:10px"><span style="width:${e[1]}%;background:${e[1]===100?'#2e9b5a':o.cor}"></span></span><b style="text-align:right">${e[1]}%</b></div>`).join('')}</div>`;
 if(S.tab==='diario')body=`<div class="stack" style="gap:12px">${[['23','Set','Concretagem da laje do 8º pavimento','42 m³ lançados. Liberação da fôrma prevista para 07/10.','Ensolarado','Juliana Silva'],['22','Set','Recebimento de aço CA-50','12 t conferidas e armazenadas no pátio B.','Nublado','Marcos Pereira'],['20','Set','Vistoria de segurança','Guarda-corpos revisados nos pavimentos 6 e 7. Sem não conformidades.','Chuva leve','Ana Ribeiro']].map(d=>`<div style="display:flex;gap:16px;padding:14px;background:#f7f8f9;border-radius:10px"><div style="width:56px;flex-shrink:0;text-align:center"><b style="font-size:20px;display:block">${d[0]}</b><span class="lc">${d[1]}</span></div><div><b style="font-size:14px">${d[2]}</b><div style="font-size:13px;color:#41464d;margin:4px 0">${d[3]}</div><span class="lc">Clima: ${d[4]} · ${d[5]}</span></div></div>`).join('')}</div>`;
 if(S.tab==='custos')body=`<div class="scroll-x"><div><div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:12px;padding:10px 0;font-size:12px;font-weight:600;color:#6a7078;text-transform:uppercase;border-bottom:1px solid #e5e7ea"><span>Categoria</span><span>Orçado</span><span>Realizado</span><span>Variação</span></div>${[['Materiais','R$ 980 mil','R$ 702 mil','-4,1%',1],['Mão de obra','R$ 720 mil','R$ 521 mil','+1,8%',0],['Equipamentos','R$ 310 mil','R$ 214 mil','-2,3%',1],['Serviços terceiros','R$ 390 mil','R$ 183 mil','0,0%',1]].map(c=>`<div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:12px;padding:12px 0;font-size:14px;border-bottom:1px solid #eeeff1"><span style="font-weight:500">${c[0]}</span><span>${c[1]}</span><span>${c[2]}</span><b style="color:${c[4]?'#1a6b3c':'#a3221b'}">${c[3]}</b></div>`).join('')}</div></div>`;
 return `<div class="stack"><button class="lnk" style="align-self:flex-start;display:flex;align-items:center;gap:6px;font-size:14px" data-go="obras">${svg('M15 18l-6-6 6-6',16,2.2)}Obras</button>
 <div class="card" style="padding:22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap">${tile(o,64,14,30)}<div class="grow"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h1 style="font-size:22px">${esc(o.nome)}</h1>${bd(o.status)}</div><div style="font-size:14px;color:#41464d;margin-top:4px">${esc(o.local)} · Responsável: ${esc(o.resp)}</div></div>
 <div style="width:260px;max-width:100%"><div class="hd" style="font-size:13px;margin-bottom:6px"><span class="muted">Progresso físico</span><b>${o.prog}%</b></div><span class="bar" style="display:block;height:10px"><span style="width:${o.prog}%;background:${o.cor}"></span></span></div></div>
 <div class="g4">${kc('Orçamento',esc(o.orc))}${kc('Realizado',esc(o.real),'color:#1e7a44')}${kc('Período',esc(o.inicio)+' – '+esc(o.prazo))}${kc('Equipe em campo',o.equipe+' pessoas')}</div>
 <div class="card" style="overflow:hidden"><div class="tabs" role="tablist">${[['resumo','Etapas'],['diario','Diário de obra'],['custos','Custos']].map(t=>`<button role="tab" aria-selected="${S.tab===t[0]}" class="tab ${S.tab===t[0]?'on':''}" data-tab="${t[0]}">${t[1]}</button>`).join('')}</div><div style="padding:20px">${body}</div></div></div>`;
}

 <div style="height:200px;display:flex;align-items:flex-end;gap:14px;border-bottom:1px solid #e5e7ea;padding:0 6px">${fl.map(f=>`<div style="flex-grow:1;display:flex;justify-content:center;align-items:flex-end;gap:3px" title="${f[0]}: receitas R$ ${f[1].toFixed(2).replace('.',',')}M, despesas R$ ${f[2].toFixed(2).replace('.',',')}M"><div style="width:18px;height:${h(f[1])}px;background:#2e3339;border-radius:4px 4px 0 0"></div><div style="width:18px;height:${h(f[2])}px;background:#e0892b;border-radius:4px 4px 0 0"></div></div>`).join('')}</div>

 <section class="card pad"><h2 style="margin-bottom:6px">Contas a pagar</h2>
 ${CONTAS.map(c=>`<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #eeeff1"><div class="grow"><b style="font-size:14px;display:block">${c[1]}</b><span class="lc">${c[2]} · vence ${c[3]}</span></div><b style="font-size:14px;width:100px;text-align:right">${c[4]}</b>${S.pagas[c[0]]?`<span style="width:84px;text-align:center;font-size:12px;font-weight:600;color:#1e7a44;background:#e3f5e9;border-radius:6px;padding:8px 0">Paga</span>`:`<button class="btn out" data-pagar="${c[0]}">Pagar</button>`}</div>`).join('')}</section></div></div>`;

const ph=(t,s,btn='')=>`<div class="hd" style="align-items:flex-end;gap:12px;flex-wrap:wrap"><div><h1>${t}</h1><p class="sub">${s}</p></div>${btn}</div>`;
const kc4=a=>`<div class="g4">${a.map(k=>`<div class="card" style="padding:16px 18px"><div class="kl">${k[0]}</div><b style="font-size:22px;color:${k[2]||'#1d2126'}">${k[1]}</b>${k[3]?`<div class="kd muted" style="margin-top:2px">${k[3]}</div>`:''}</div>`).join('')}</div>`;
const tbl=(cols,hs,rows,empty)=>`<div class="card scroll-x" style="overflow:hidden"><div><div class="tbl-h" style="grid-template-columns:${cols}">${hs.map(h=>`<span>${h}</span>`).join('')}</div>${rows.map(r=>`<div class="tbl-r" style="grid-template-columns:${cols};padding:12px 20px">${r.map(c=>`<span style="min-width:0">${c}</span>`).join('')}</div>`).join('')}${rows.length?'':`<div style="padding:40px;text-align:center" class="muted">${empty||'Nenhum registro encontrado.'}</div>`}</div></div>`;
const two=(a,b)=>`<b style="display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis">${a}</b><span class="lc">${b}</span>`;
const sub=(k,d)=>S.sub[k]||d;
const chips=(k,opts)=>`<div style="display:flex;gap:8px;flex-wrap:wrap">${opts.map(f=>`<button class="chip ${sub(k,opts[0])===f?'on':''}" data-sub="${k}|${f}">${f}</button>`).join('')}</div>`;
const flat=h=>h.replace('class="card scroll-x"','class="scroll-x"');
const tabs=(k,opts)=>`<div class="tabs" role="tablist">${opts.map(t=>`<button role="tab" aria-selected="${sub(k,opts[0])===t}" class="tab ${sub(k,opts[0])===t?'on':''}" data-sub="${k}|${t}">${t}</button>`).join('')}</div>`;
const act=(key,label,msg)=>`<button class="btn sm" data-do="${key}" data-msg="${esc(msg)}">${label}</button>`;
const plusBtn=(key,label,msg)=>`<button class="btn" data-do="${key}" data-msg="${esc(msg)}">${svg('M12 5v14M5 12h14',16,2.2)}${label}</button>`;
const bar=(v,c)=>`<span style="display:flex;align-items:center;gap:8px"><span class="bar"><span style="width:${Math.min(100,v)}%;background:${c}"></span></span><b style="width:38px;font-size:13px">${v}%</b></span>`;
const stars=n=>`<span class="star" aria-label="${n} de 5">${'★'.repeat(Math.round(n))}<span style="color:#dcdfe3">${'★'.repeat(5-Math.round(n))}</span></span> <b style="font-size:13px">${n.toFixed(1).replace('.',',')}</b>`;
const money=m=>m>=1?'R$ '+m.toFixed(2).replace('.',',')+'M':'R$ '+Math.round(m*1000)+' mil';

 <section class="card pad"><h2 style="margin-bottom:6px">Rateio do recebido por sócio / empresa</h2><div class="lc" style="margin-bottom:8px">Calculado automaticamente pelo % de cada contrato (sem IPTU)</div>
 ${sc.map(([n,v])=>`<div style="display:grid;grid-template-columns:minmax(0,160px) 1fr 130px;gap:12px;align-items:center;padding:6px 0;font-size:14px"><span style="font-weight:600">${n}</span><span class="bar"><span style="width:${Math.round(v/sc[0][1]*100)}%;background:#454b54"></span></span><b style="text-align:right">${brl(v)}</b></div>`).join('')||'<span class="lc">Nenhum recebimento no filtro atual.</span>'}</section>`;
}
function locContratos(){
 const L=locFilter();
 const venc=LOC.filter(c=>diasFim(c)<=120).length,rj=LOC.filter(c=>(reaj(c)-HOJE)/864e5<=45).length;
 return `${chips('lgrp',LGRP)}
 ${kc4([['Contratos ativos',LOC.length],['Valor mensal contratado',brl(LOC.reduce((s,c)=>s+c.val,0))],['Reajustes nos próximos 45 dias',rj,'#8a5800'],['Vencendo em até 120 dias',venc,'#a3221b']])}
 ${flat(tbl('.6fr 2.1fr 1.1fr 1fr .8fr 1.1fr 1.3fr 1.5fr',['Pasta','Locatário / imóvel','Início – venc.','Prazo','Índice','Valor','Próx. reajuste','Rateio'],L.map(c=>{const r=reaj(c),dr=(r-HOJE)/864e5,df=diasFim(c);return [`<b class="lc" style="font-weight:600">${c.pasta}</b>`,two(esc(c.loc),esc(c.im)),`<span style="font-size:13px">${c.ini}<span class="lc" style="display:block">${c.fim}${df<=120?` · <b style="color:#a3221b">vence em ${df}d</b>`:''}</span></span>`,`<span style="font-size:13px">${c.prazo}<span class="lc" style="display:block">${c.ren}</span></span>`,c.idx,`<b>${brl(c.val)}</b>`,`<span style="font-size:13px;${dr<=45?'color:#8a5800;font-weight:600':''}">${MN[r.getMonth()]}/${String(r.getFullYear()).slice(2)}</span>`,`<span class="lc">${c.soc.map(([n,p])=>n+' '+String(Math.round(p*1000)/10).replace('.',',')+'%').join(' · ')}</span>`]})))}`;
}
function locImovel(){
 const c=LOC.find(x=>x.id===sub('limv','l8'))||LOC[0];
 const ms=[];for(let m=1;m<=9;m++){const k='2026-'+pad(m);if(parcN(c,k)>=1)ms.push(k)}
 const pagos=ms.filter(m=>!c.ab.includes(m));
 const hist=ms.slice().reverse().map(m=>{const ab=c.ab.includes(m),n=+m.slice(5),off=(+c.id.slice(1)*3+n)%4;const dt=m===MES&&!ab?c.pg.d:pad(Math.min(c.dia+off,28))+'/'+pad(n);
  return [`<b>${mlab(m)}</b>`,`<span class="lc">${parcN(c,m)} / ${c.pt}</span>`,brl(tot(c)),...c.soc.map(([,p])=>`<span class="lc">${brl(c.val*p)}</span>`),ab?'<span class="lc">—</span>':dt,ab?bd(diasAtr(c,m)>0?'Atrasado '+diasAtr(c,m)+'d':'A vencer'):bd('Recebido')]});
 const cols='.8fr .8fr 1.1fr '+c.soc.map(()=>'1fr').join(' ')+' .9fr 1.1fr';
 return `<label class="fld" style="max-width:520px">Imóvel / locatário<select data-lsel="limv">${LOC.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${esc(x.im.split(' — ')[0])} — ${esc(x.loc)}</option>`).join('')}</select></label>
 <div class="card pad" style="display:flex;gap:18px;flex-wrap:wrap;align-items:center"><div class="grow">${two(esc(c.loc),esc(c.im))}<div class="lc" style="margin-top:4px">Pasta ${c.pasta} · ${c.prazo} (${c.ini} a ${c.fim}) · ${c.idx} · ${c.ct}</div></div>
 <div style="text-align:right"><div class="kl">Recebido em 2026</div><b style="font-size:20px;color:#1a6b3c">${brl(pagos.length*tot(c))}</b></div><div style="text-align:right"><div class="kl">Em aberto</div><b style="font-size:20px;color:${c.ab.length?'#a3221b':'#1d2126'}">${brl(c.ab.length*tot(c))}</b></div></div>
 ${flat(tbl(cols,['Mês/ano','Parcela','Valor',...c.soc.map(([n,p])=>n+' '+Math.round(p*100)+'%'),'Pagamento','Situação'],hist))}`;
}
function locInad(){
 const L=inad();
 if(!L.length)return `<div class="muted" style="text-align:center;padding:40px">Nenhum aluguel em atraso. 🎉</div>`;
 return `${kc4([['Locatários inadimplentes',L.length,'#a3221b'],['Parcelas em atraso',L.reduce((s,c)=>s+atrasadas(c).length,0),'#a3221b'],['Valor em atraso',brl(valAtr()),'#a3221b'],['Maior atraso',Math.max(...L.map(c=>diasAtr(c,atrasadas(c)[0])))+' dias']])}
 ${L.map(c=>{const a=atrasadas(c);return `<section class="card pad stack" style="gap:10px;border-left:4px solid #c93a31"><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span class="grow">${two(esc(c.loc),c.grp+' · pasta '+c.pasta+' · '+esc(c.ct))}</span><b style="font-size:18px;color:#a3221b">${brl(a.length*tot(c))}</b></div>
 <div style="display:flex;gap:8px;flex-wrap:wrap">${a.map(m=>`<span class="bd" style="background:#fde4e2;color:#a3221b">${mlab(m)} · parc. ${parcN(c,m)}/${c.pt} · ${diasAtr(c,m)}d</span>`).join('')}</div>
 ${c.cob.length?`<div style="background:#f7f8f9;border-radius:8px;padding:10px 12px;font-size:13px">${c.cob.map(x=>`<div style="padding:2px 0"><b>${x.d}</b> — ${esc(x.t)}</div>`).join('')}</div>`:'<span class="lc">Nenhuma cobrança registrada.</span>'}
 <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" data-lm="receb|${c.id}">Registrar recebimento</button><button class="btn ghost sm" data-lm="cob|${c.id}">Registrar cobrança</button><button class="btn ghost sm" data-zap="${c.id}">Enviar lembrete por WhatsApp</button></div></section>`}).join('')}`;
}
function locNF(){
 const L=LOC.filter(c=>c.nf);
 const emit=L.filter(c=>c.nfOk),base=emit.reduce((s,c)=>s+c.val,0);
 return `<div class="lc">Contratos dos grupos L.A.A, LAN e Brilhante exigem nota fiscal. Sublocações não exigem NF e podem ser pagas em dinheiro ou ND.</div>
 ${kc4([['NFs emitidas (set/26)',emit.length,'#1a6b3c'],['A emitir',L.filter(c=>locSt(c)==='Recebido'&&!c.nfOk).length,'#8a5800'],['Aguardando recebimento',L.filter(c=>locSt(c)!=='Recebido').length,'#34506a'],['PIS + COFINS estimados',brl(base*.0365),'#1d2126','0,65% + 3,00% · confirmar com a contabilidade']])}
 ${flat(tbl('2.2fr .9fr 1.1fr 1fr 2fr',['Locatário','Grupo','Valor','Recebimento','Nota fiscal'],L.map(c=>{const st=locSt(c);return [two(esc(c.loc),'Competência set/26 · pasta '+c.pasta),`<span class="lc">${c.grp}</span>`,`<b>${brl(c.val)}</b>`,st==='Recebido'?c.pg.d:bd(st==='Atrasado'?'Atrasado':'A vencer'),c.nfOk?`<span style="display:flex;gap:8px;align-items:center">${bd('NF emitida')}<span class="lc">nº ${c.nfNum}</span></span>`:st==='Recebido'?`<span style="display:flex;gap:8px;align-items:center">${bd('NF pendente')}<button class="btn sm" data-nf="${c.id}">Emitir NF</button></span>`:'<span class="lc">Emitir após o recebimento</span>']})))}`;
}
function lmodal(){
 const m=S.lmodal;if(!m)return '';
 const c=LOC.find(x=>x.id===m.id);
 const close=`<button class="ib" style="width:36px;height:36px;background:#f1f2f4" data-lm="close" aria-label="Fechar">${svg('M6 6l12 12M18 6L6 18',16,2.2)}</button>`;
 if(m.t==='receb')return `<div class="overlay" data-lm="close-bg"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="lt"><div class="hd"><h2 id="lt" style="font-size:18px;font-weight:700">Registrar recebimento</h2>${close}</div>
 <div>${two(esc(c.loc),esc(c.im))}</div>
 <div class="fld">Parcelas recebidas${c.ab.map(k=>`<label style="display:flex;gap:10px;align-items:center;font-weight:500;padding:6px 0"><input type="checkbox" name="lpp" value="${k}" checked style="width:18px;height:18px;accent-color:#2e3339"> ${mlab(k)} — parcela ${parcN(c,k)}/${c.pt} — ${brl(tot(c))}</label>`).join('')}</div>
 <div class="g2" style="gap:12px"><label class="fld">Data<input id="lData" type="date" value="2026-09-24"></label><label class="fld">Forma<select id="lForma">${['PIX','Transferência','Boleto','Dinheiro','ND'].map(f=>`<option>${f}</option>`).join('')}</select></label></div>
 ${c.nf?'<span class="lc">Após salvar, a nota fiscal ficará pendente de emissão na aba Notas fiscais.</span>':'<span class="lc">Sublocação — não exige nota fiscal.</span>'}
 <div style="display:flex;justify-content:flex-end;gap:10px"><button class="btn ghost" data-lm="close">Cancelar</button><button class="btn" data-lm="save-receb|${c.id}">Salvar recebimento</button></div></div></div>`;
 if(m.t==='cob')return `<div class="overlay" data-lm="close-bg"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="lt"><div class="hd"><h2 id="lt" style="font-size:18px;font-weight:700">Registrar cobrança</h2>${close}</div>
 <div>${two(esc(c.loc),atrasadas(c).length+' parcela(s) em atraso · '+brl(atrasadas(c).length*tot(c)))}</div>
 <label class="fld">Tipo de contato<select id="cTipo"><option>Ligação</option><option>WhatsApp</option><option>E-mail</option><option>Visita no local</option><option>Notificação extrajudicial</option></select></label>
 <label class="fld">O que foi combinado<input id="cTxt" placeholder="Ex.: prometeu pagar até 30/09"></label>
 <div style="display:flex;justify-content:flex-end;gap:10px"><button class="btn ghost" data-lm="close">Cancelar</button><button class="btn" data-lm="save-cob|${c.id}">Salvar</button></div></div></div>`;
 if(m.t==='rel'){const L=inad();return `<div class="overlay" data-lm="close-bg"><div class="dlg rel" id="rel" role="dialog" aria-modal="true" aria-labelledby="lt" style="width:820px;max-height:90vh;overflow:auto">
 <div class="hd" style="gap:12px"><img src="logo.png" alt="LAN" style="height:42px"><span class="grow"></span><button class="btn ghost sm noprint" onclick="window.print()">Imprimir / salvar PDF</button><span class="noprint">${close}</span></div>
 <div><h2 id="lt" style="font-size:20px;font-weight:700">Relatório de aluguéis em atraso</h2><div class="lc">Posição em 24/09/2026 · para Neto · ${L.length} locatários · ${brl(valAtr())} em atraso</div></div>
 ${L.map(c=>{const a=atrasadas(c);return `<div style="border-top:1px solid #e5e7ea;padding-top:12px"><div class="hd"><b>${esc(c.loc)}</b><b style="color:#a3221b">${brl(a.length*tot(c))}</b></div><div class="lc">${c.grp} · pasta ${c.pasta} · ${esc(c.im)} · ${esc(c.ct)}</div>
 <table style="width:100%;border-collapse:collapse;font-size:13px;margin-top:8px"><tr style="text-align:left;color:#6a7078"><th style="padding:4px 0">Referência</th><th>Parcela</th><th>Vencimento</th><th>Dias em atraso</th><th style="text-align:right">Valor</th></tr>${a.map(m=>{const v=vencDt(c,m);return `<tr style="border-top:1px solid #eeeff1"><td style="padding:5px 0">${mlab(m)}</td><td>${parcN(c,m)} / ${c.pt}</td><td>${pad(v.getDate())}/${pad(v.getMonth()+1)}/2026</td><td>${diasAtr(c,m)}</td><td style="text-align:right">${brl(tot(c))}</td></tr>`}).join('')}</table>
 ${c.cob.length?`<div class="lc" style="margin-top:6px">Cobranças: ${c.cob.map(x=>x.d+' — '+esc(x.t)).join(' · ')}</div>`:''}</div>`}).join('')}
 <div class="hd" style="border-top:2px solid #1d2126;padding-top:10px"><b>Total em atraso</b><b style="font-size:18px">${brl(valAtr())}</b></div>
 <div class="lc">Dados fictícios de demonstração.</div></div></div>`}
 return '';
}

function other(){
 const n=NAV.find(x=>x[0]===S.screen)||NAV[0];
 return `<div class="stack"><h1>${n[1]}</h1><div class="card" style="border-style:dashed;border-color:#cdd1d6;padding:56px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center">
 <div style="width:56px;height:56px;border-radius:14px;background:#eceef1;color:#3d434b;display:flex;align-items:center;justify-content:center">${svg(I[n[0]],26)}</div>
 <b style="font-size:16px">Módulo ${n[1]}</b><span style="font-size:14px;color:#41464d;max-width:420px">Esta tela ainda não foi detalhada no protótipo. Os fluxos navegáveis são Dashboard, Obras, Planejamento, Financeiro e Compras.</span>
 <button class="btn" data-go="dashboard" style="margin-top:6px">Voltar ao Dashboard</button></div></div>`;
}

function modal(){
 if(!S.modal)return '';
 return `<div class="overlay" data-act="close-bg"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dt"><div class="hd"><h2 id="dt" style="font-size:18px;font-weight:700">Nova obra</h2><button class="ib" style="width:36px;height:36px;background:#f1f2f4" data-act="close" aria-label="Fechar">${svg('M6 6l12 12M18 6L6 18',16,2.2)}</button></div>
 <label class="fld">Nome da obra<input id="fNome" placeholder="Ex.: Residencial Jardim das Flores"></label>
 <label class="fld">Localização<input id="fLocal" placeholder="Cidade - UF"></label>
 <label class="fld">Status inicial<select id="fStatus"><option>Planejamento</option><option>Em execução</option><option>Aguardando material</option></select></label>
 <div style="display:flex;justify-content:flex-end;gap:10px;padding-top:4px"><button class="btn ghost" data-act="close">Cancelar</button><button class="btn" data-act="criar">Criar obra</button></div></div></div>`;
}

const app=document.getElementById('app');
function render(){
 const ae=document.activeElement,fid=ae&&ae.id,sel=ae&&ae.selectionStart;
 const scr={dashboard:dash,obras:obras,obra:obra,planejamento:plan,financeiro:fin,compras:compras,projetos:projetos,orcamento:orcamento,estoque:estoque,equipamentos:equipamentos,rh:rh,seguranca:seguranca,documentos:documentos,contratos:contratos,clientes:clientes,fornecedores:fornecedores,marketplace:marketplace,relatorios:relatorios,ia:ia,locacoes:locacoes}[S.screen]||other;
 const mainEl=app.querySelector('main'),st=mainEl?mainEl.scrollTop:0;
 app.innerHTML=side()+`<div class="col-main">${head()}<main id="main">${scr()}</main></div>`+modal()+lmodal()+(S.toast?`<div class="toast" role="status">${svg('M5 12l5 5L20 7',18,2.4,'#7ee2a8')}${esc(S.toast)}</div>`:'');
 if(fid==='q'){const q=document.getElementById('q');q.focus();try{q.setSelectionRange(sel,sel)}catch(e){}}
 if(S._keepScroll){app.querySelector('main').scrollTop=st}
 S._keepScroll=false;
}
function go(s){S.modal=false;S.screen=s;if(window.innerWidth<820)S.collapsed=true;render();app.querySelector('main').scrollTop=0;history.replaceState(null,'','#'+s)}

app.addEventListener('click',e=>{
 const t=e.target.closest('[data-go],[data-obra],[data-act],[data-filter],[data-tab],[data-pagar],[data-aprovar],[data-do],[data-sub],[data-tog],[data-cart],[data-lm],[data-nf],[data-zap]');if(!t)return;
 const d=t.dataset;
 if(d.go)return go(d.go);
 if(d.obra){S.obraId=d.obra;S.tab='resumo';return go('obra')}
 if(d.filter)return set({filter:d.filter});
 if(d.tab)return set({tab:d.tab});
 if(d.pagar){const c=CONTAS.find(x=>x[0]===d.pagar);S.pagas[d.pagar]=true;S._keepScroll=true;return flash('Pagamento agendado: '+c[1])}
 if(d.lm){const [k,id]=d.lm.split('|');
  if(k==='close'||(k==='close-bg'&&e.target===t)){S.lmodal=null;S._keepScroll=true;return render()}
  if(k==='close-bg')return;
  if(k==='receb'||k==='cob'||k==='rel'){S.lmodal={t:k,id};S._keepScroll=true;return render()}
  const c=LOC.find(x=>x.id===id);
  if(k==='save-receb'){const sel=[...document.querySelectorAll('input[name=lpp]:checked')].map(x=>x.value);if(!sel.length)return flash('Selecione ao menos uma parcela');
   const dt=document.getElementById('lData').value.split('-'),f=document.getElementById('lForma').value;
   c.ab=c.ab.filter(m=>!sel.includes(m));if(sel.includes(MES)){c.pg={d:dt[2]+'/'+dt[1],f};if(c.nf)c.nfOk=0}
   S.lmodal=null;S._keepScroll=true;return flash('Recebimento registrado: '+c.loc+' — '+brl(sel.length*tot(c)))}
  if(k==='save-cob'){const tx=document.getElementById('cTxt').value.trim(),tp=document.getElementById('cTipo').value;c.cob.push({d:'24/09',t:tp+(tx?' — '+tx:'')});S.lmodal=null;S._keepScroll=true;return flash('Cobrança registrada: '+c.loc)}
 }
 if(d.nf){const c=LOC.find(x=>x.id===d.nf);c.nfOk=1;c.nfNum='2026/0'+(400+ +c.id.slice(1));S._keepScroll=true;return flash('NF '+c.nfNum+' emitida para '+c.loc)}
 if(d.zap){const c=LOC.find(x=>x.id===d.zap);c.cob.push({d:'24/09',t:'WhatsApp — lembrete automático enviado'});S._keepScroll=true;return flash('Lembrete enviado por WhatsApp para '+c.loc)}
 if(d.do){S.done[d.do]=true;if(d.do==='i4')DOCS.forEach(x=>{if(x[5]==='Vencendo')S.done[x[0]]=true});S._keepScroll=true;return flash(d.msg)}
 if(d.sub){const i=d.sub.indexOf('|');S.sub[d.sub.slice(0,i)]=d.sub.slice(i+1);S._keepScroll=true;return render()}
 if(d.tog){S.auto[d.tog]=!S.auto[d.tog];S._keepScroll=true;return flash('Automação '+(S.auto[d.tog]?'ativada':'desativada'))}
 if(d.cart){if(d.cart==='enviar'){const n=Object.keys(S.cart).length;S.cart={};S._keepScroll=true;return flash('Cotação de '+n+' ite'+(n>1?'ns':'m')+' enviada aos fornecedores')}if(S.cart[d.cart])delete S.cart[d.cart];else S.cart[d.cart]=true;S._keepScroll=true;return render()}
 if(d.aprovar){S.aprovados[d.aprovar]=true;S._keepScroll=true;return flash('Pedido '+d.aprovar+' aprovado')}
 if(d.act==='toggle')return set({collapsed:!S.collapsed});
 if(d.act==='modal'){set({modal:true});setTimeout(()=>{const n=document.getElementById('fNome');n&&n.focus()},0);return}
 if(d.act==='close'||(d.act==='close-bg'&&e.target===t))return set({modal:false});
 if(d.act==='criar'){
  const nome=document.getElementById('fNome').value.trim()||'Nova obra sem nome';
  const local=document.getElementById('fLocal').value.trim()||'Local a definir';
  const status=document.getElementById('fStatus').value;
  S.obras.unshift({id:'n'+Date.now(),nome,local,status,prog:0,cor:'#2e3339',resp:'Neto',inicio:'Out/26',prazo:'A definir',orc:'A definir',real:'R$ 0,00',equipe:0,gs:10,ge:12});
  S.filter='Todas';S.q='';S.modal=false;go('obras');flash('Obra “'+nome+'” criada');
 }
});
app.addEventListener('change',e=>{if(e.target.dataset.lsel){S.sub[e.target.dataset.lsel]=e.target.value;S._keepScroll=true;return render()}if(e.target.dataset.task){S.doneTasks[e.target.dataset.task]=e.target.checked;S._keepScroll=true;render()}});
app.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;S.filter='Todas';if(S.screen!=='obras'){S.screen='obras'}render()}});
document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('q').focus()}
 if(e.key==='Escape'&&S.modal)set({modal:false});if(e.key==='Escape'&&S.lmodal)set({lmodal:null});
});
const h=location.hash.slice(1);if(h&&NAV.some(n=>n[0]===h))S.screen=h;
render();
})();
</script>
